plugins {
    id 'com.android.application'
}

android {
    namespace 'com.zhongan.agent'
    compileSdk 34

    defaultConfig {
        applicationId 'com.zhongan.agent'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}