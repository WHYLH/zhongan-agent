<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>墨金定制图标样张</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f0eb;color:#20242a;font:14px "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:960px;margin:auto;padding:40px 28px}header{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #d8d4ca;padding-bottom:20px;margin-bottom:24px}h1{font-size:26px;font-weight:550;margin:0}small{color:#68707a}.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid #d8d4ca;background:#fcfbf8}.item{min-height:128px;padding:20px 8px;display:grid;place-items:center;align-content:center;gap:14px;border-right:1px solid #e3e0d8;border-bottom:1px solid #e3e0d8}.item:nth-child(6n){border-right:0}.item:nth-last-child(-n+4){border-bottom:0}svg{width:32px;height:32px;fill:none;stroke:#856631}.item span{font-size:12px;color:#68707a}.dark{margin-top:28px;background:#14171c;color:#f0eee8}.dark svg{stroke:#dcc18b}.dark .item{border-color:#2c3036}.dark .item span{color:#92979f}@media(max-width:600px){main{padding:24px 16px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.item{min-height:100px}.item:nth-child(6n){border-right:1px solid #e3e0d8}.item:nth-child(4n){border-right:0}.item:nth-last-child(-n+4){border-bottom:1px solid #e3e0d8}.item:last-child{border-bottom:0}svg{width:26px;height:26px}}
</style></head><body><main><header><h1>墨金定制图标</h1><small>24 SYMBOLS / 1.4 PX / CURRENTCOLOR</small></header><div class="grid" id="day"></div><div class="grid dark" id="dark"></div></main><script>
const names=['xiaoan','chat','send','mic','speaker','accounts','assets','cashflow','loans','wealth','payments','settings','details','transfer','copy','lock','password','receipt','success','pending','alert','close','back','arrow'];
for(const root of [document.querySelector('#day'),document.querySelector('#dark')])root.innerHTML=names.map(name=>`<div class="item"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="./icons.svg#i-${name}"></use></svg><span>${name}</span></div>`).join('');
</script></body></html>
